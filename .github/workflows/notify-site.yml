# Copy this file into EACH product repo (Swift-Speak, Snap-Translate) as
#   .github/workflows/notify-site.yml
# When a release is published, edited or deleted there, it asks the website repo to refresh its
# download links (.github/workflows/update-releases.yml in the website repo).
# GitHub runs a release workflow from the commit the release's tag points to, so this file must
# already be in that commit: a release tagged before the file was added never triggers it (use
# Actions -> "Notify website" -> Run workflow for those). The same goes for changes to this file:
# an existing release keeps the version that is in its tagged commit.
# Ticking or clearing "Set as a pre-release" is not an "edited" event: GitHub sends "released"
# (pre-release -> release) or "prereleased", so both are listed. One change can fire two events;
# the website simply refreshes twice.
# Needs the secret SITE_DISPATCH_TOKEN in the product repo (or in the organization).
# Setup: DOWNLOADS-SETUP.md in the website repo.
name: Notify website

on:
  workflow_dispatch:
  release:
    types: [published, released, prereleased, edited, deleted, unpublished]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the website to refresh its download links
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE_REPO: ${{ vars.SITE_REPO || 'start-life/lifeai-web' }}
          PRODUCT: ${{ github.event.repository.name }}
          ACTION: ${{ github.event.action || github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The SITE_DISPATCH_TOKEN secret is missing (see DOWNLOADS-SETUP.md in the website repo)."
            exit 1
          fi
          body=$(jq -n --arg product "$PRODUCT" --arg action "$ACTION" --arg tag "$TAG" \
            '{event_type: "product-release", client_payload: {product: $product, action: $action, tag: $tag}}')
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SITE_REPO/dispatches" \
            -d "$body"
          echo "Sent to $SITE_REPO: $PRODUCT $ACTION $TAG"
